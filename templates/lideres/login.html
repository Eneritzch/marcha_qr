<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Líderes - Marcha UNEMI</title>
    <link rel="icon" type="image/x-icon" href="/static/img/icono.webp">
    <link rel="manifest" href="/static/manifest.json">
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/js/sw.js')
                    .then(reg => console.log('Service Worker registrado', reg))
                    .catch(err => console.log('Error al registrar SW', err));
            });
        }
    </script>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unemi: {
                            blue: '#0F1E4B',
                            orange: '#EF7D00',
                            bg: '#F8FAFC',
                            text: '#1E293B'
                        },
                        unemi_hover: {
                            orange: '#d97200',
                            blue: '#0c183b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.474.0/dist/umd/lucide.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }

        input::placeholder {
            color: #94a3b8 !important;
            font-weight: 500;
            opacity: 0.7;
        }
    </style>
</head>
<body class="bg-white min-h-screen">

    <!-- Navbar (Absolute) -->
    <nav class="absolute top-0 left-0 w-full p-6 z-40 flex justify-between items-center bg-gradient-to-b from-black/60 to-transparent">
        <div class="flex items-center space-x-3">
             <img src="/static/img/icono.webp" alt="UNEMI Logo" class="w-10 h-10 object-contain drop-shadow-md">
            <span class="font-black tracking-widest text-white text-lg hidden sm:inline shadow-black drop-shadow-md">MARCHA UNEMI</span>
        </div>
        <a href="/" class="text-white hover:text-unemi-orange font-bold text-sm bg-white/20 backdrop-blur-md px-4 py-2 rounded-full border border-white/30 hover:bg-white/30 transition-all">
            ← Volver al Inicio
        </a>
    </nav>

    <!-- HERO SECTION (Carousel) -->
    <div class="relative h-[40vh] min-h-[300px] lg:h-[50vh] overflow-hidden bg-slate-900">
        <!-- Carousel Images -->
        <div id="login-carousel" class="absolute inset-0 z-0">
            <!-- Since hero2.webp and hero1.webp are not in static/img yet (I didn't copy them in the previous command) 
                 Actually I should check if they exist or copy them. 
                 User said "hero2.webp" and "hero1.webp". I'll copy them too. -->
            <img src="/static/img/hero2.webp" class="absolute inset-0 w-full h-full object-cover transition-transform duration-[10s] ease-in-out scale-110 opacity-100" id="slide-1" alt="Marcha UNEMI 1">
            <img src="/static/img/hero1.webp" class="absolute inset-0 w-full h-full object-cover transition-transform duration-[10s] ease-in-out scale-110 opacity-0" id="slide-2" alt="Marcha UNEMI 2">
        </div>
        
        <!-- Gradient Overlay -->
        <div class="absolute inset-0 z-10 bg-gradient-to-t from-unemi-blue via-unemi-blue/40 to-black/30 mix-blend-multiply"></div>
        <div class="absolute inset-0 z-10 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>

        <!-- Hero Content -->
        <div class="absolute bottom-0 left-0 right-0 p-8 sm:p-12 z-20 text-center">
             <span class="bg-unemi-orange text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest mb-3 inline-block shadow-lg animate-in zoom-in">Panel Administrativo</span>
             <h1 class="text-3xl sm:text-5xl font-black text-white uppercase tracking-tighter mb-2 drop-shadow-2xl">Liderazgo que Inspira</h1>
        </div>
    </div>

    <!-- LOGIN FORM CONTAINER -->
    <div class="relative z-30 -mt-10 px-4 pb-20 max-w-md mx-auto">
        <div class="bg-white rounded-3xl shadow-2xl shadow-slate-900/10 border border-slate-100 overflow-hidden p-8 sm:p-10 animate-fade-in-up">
            
            <div class="text-center mb-8">
                <h2 class="text-2xl font-black text-unemi-blue mb-2">Bienvenido, Líder</h2>
                <p class="text-slate-400 text-sm">Ingresa tus credenciales para gestionar tu equipo.</p>
            </div>

            <form id="login-form" class="space-y-6">
                
                <div id="error-message" class="hidden transform transition-all bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl flex items-start space-x-3">
                    <i data-lucide="alert-circle" class="text-red-500 w-5 h-5 mt-0.5 flex-shrink-0"></i>
                    <div>
                        <h4 class="text-red-800 font-bold text-sm">Error de Acceso</h4>
                        <p class="text-red-600 text-sm mt-1" id="error-text"></p>
                    </div>
                </div>

                <div class="space-y-5">
                    <div class="group">
                        <label for="username" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1 transition-colors group-focus-within:text-unemi-blue">Usuario</label>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-unemi-blue transition-colors">
                                <i data-lucide="user" class="w-5 h-5"></i>
                            </div>
                            <input
                                id="username"
                                name="username"
                                type="text"
                                required
                                placeholder="ej: rpezer"
                                class="w-full pl-12 pr-4 py-4 bg-white border-2 border-slate-300 border-r-4 border-r-slate-300 rounded-xl focus:border-unemi-blue focus:border-r-unemi-orange focus:bg-white outline-none transition-all font-medium text-slate-700 shadow-inner"
                            />
                        </div>
                    </div>

                    <div class="group">
                            <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1 transition-colors group-focus-within:text-unemi-blue">Contraseña</label>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-unemi-blue transition-colors">
                                <i data-lucide="lock" class="w-5 h-5"></i>
                            </div>
                            <input
                                id="password"
                                name="password"
                                type="password"
                                required
                                placeholder="••••••••"
                                class="w-full pl-12 pr-4 py-4 bg-white border-2 border-slate-300 border-r-4 border-r-slate-300 rounded-xl focus:border-unemi-blue focus:border-r-unemi-orange focus:bg-white outline-none transition-all font-medium text-slate-700 shadow-inner"
                            />
                            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-unemi-blue text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/10 hover:shadow-blue-900/20 hover:bg-slate-800 hover:-translate-y-0.5 transition-all active:scale-95 active:translate-y-0 flex items-center justify-center space-x-2 group"
                >
                    <span id="btn-text">INICIAR SESIÓN</span>
                    <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                    <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                </button>

                <!-- Status message (Replacement for offline-login-zone) -->
                <div id="offline-status-text" class="hidden animate-in fade-in slide-in-from-top-2 pt-4 border-t border-slate-100 mt-4">
                    <div class="bg-orange-50 text-unemi-orange border border-dashed border-unemi-orange/30 p-4 rounded-xl flex items-center gap-3">
                        <div class="w-8 h-8 bg-unemi-orange/10 rounded-full flex items-center justify-center">
                            <i data-lucide="wifi-off" class="w-4 h-4"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-[10px] font-black uppercase tracking-widest leading-none">Sin conexión</p>
                            <p class="text-[11px] font-bold mt-1">Ingresando a Base Local...</p>
                        </div>
                    </div>
                </div>

            </form>
        </div>
        
        <p class="text-center text-slate-400 text-xs font-bold mt-8 uppercase tracking-widest">Marcha con Orgullo · UNEMI 2026</p>
    </div>

    <script>
        try {
            lucide.createIcons();
        } catch(e) { console.error("Lucide icons failed to load:", e); }

        // === CAROUSEL LOGIC ===
        const slides = [document.getElementById('slide-1'), document.getElementById('slide-2')];
        let currentSlide = 0;

        setInterval(() => {
            slides[currentSlide].classList.remove('opacity-100', 'scale-110');
            slides[currentSlide].classList.add('opacity-0', 'scale-100');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.remove('opacity-0', 'scale-100');
            slides[currentSlide].classList.add('opacity-100', 'scale-110');
        }, 6000);

        // === PASSWORD TOGGLE ===
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // === CRYPTO HELPER (SHA-256) ===
        async function hashValue(value) {
            const msgBuffer = new TextEncoder().encode(value);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // === LOGIN LOGIC ===
        const loginForm = document.getElementById('login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const errorDiv = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');
                const btnText = document.getElementById('btn-text');
                const btnSpinner = document.getElementById('btn-spinner');
                const submitBtn = document.querySelector('button[type="submit"]');

                // Reset UI
                errorDiv.classList.add('hidden');
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                btnText.classList.add('hidden');
                document.querySelector('.lucide-arrow-right')?.classList.add('hidden');
                btnSpinner.classList.remove('hidden');

                const username = usernameInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                if (navigator.onLine) {
                    try {
                        const response = await axios.post('/api/v1/lideres/login/', {
                            username: username,
                            password: password
                        });
                        
                        // Success - Store Token & User Profile
                        localStorage.setItem('token', response.data.token);
                        localStorage.setItem('user', JSON.stringify(response.data));
                        
                        // CACHE CREDENTIALS FOR OFFLINE
                        const credHash = await hashValue(username + ":" + password);
                        const offlineCreds = JSON.parse(localStorage.getItem('offlineCreds') || '{}');
                        offlineCreds[username] = {
                            hash: credHash,
                            profile: response.data // Keep profile for offline state
                        };
                        localStorage.setItem('offlineCreds', JSON.stringify(offlineCreds));

                        setTimeout(() => {
                            window.location.href = '/dashboard/';
                        }, 500);

                    } catch (error) {
                        handleLoginError(error, errorDiv, errorText, submitBtn, btnText, btnSpinner);
                    }
                } else {
                    // OFFLINE LOGIN VERIFICATION
                    const offlineCreds = JSON.parse(localStorage.getItem('offlineCreds') || '{}');
                    const stored = offlineCreds[username];
                    
                    if (stored) {
                        const inputHash = await hashValue(username + ":" + password);
                        if (inputHash === stored.hash) {
                            // Offline Auth Success
                            localStorage.setItem('offline_mode', 'true');
                            localStorage.setItem('user', JSON.stringify(stored.profile));
                            // Token stays empty, dashboard will handle it
                            
                            setTimeout(() => {
                                window.location.href = '/dashboard/';
                            }, 500);
                            return;
                        }
                    }
                    
                    // Offline Auth Failure
                    handleLoginError({ message: "Credenciales offline no reconocidas o usuario nunca ingresó con red." }, errorDiv, errorText, submitBtn, btnText, btnSpinner);
                }
            });
        }

        function handleLoginError(error, errorDiv, errorText, submitBtn, btnText, btnSpinner) {
            console.error(error);
            errorDiv.classList.remove('hidden');
            let msg = error.message || 'Credenciales incorrectas o problema de conexión.';
            
            if (error.response) {
                if (error.response.data.error) msg = error.response.data.error;
                if (error.response.status === 401) msg = "Usuario o contraseña inválidos.";
            }
            
            errorText.textContent = msg;
            submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            btnText.classList.remove('hidden');
            document.querySelector('.lucide-arrow-right')?.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
            errorDiv.classList.add('animate-shake');
            setTimeout(() => errorDiv.classList.remove('animate-shake'), 500);
        }

        function checkOfflineStatus() {
            const statusBox = document.getElementById('offline-status-text');
            if (!navigator.onLine) {
                statusBox.classList.remove('hidden');
            } else {
                statusBox.classList.add('hidden');
            }
        }

        window.addEventListener('online', checkOfflineStatus);
        window.addEventListener('offline', checkOfflineStatus);
        checkOfflineStatus();

        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard/';
        }
    </script>
</body>
</html>
