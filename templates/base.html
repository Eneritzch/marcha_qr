<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marcha UNEMI{% endblock %}</title>
    <link rel="manifest" href="/manifest.json">
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado', reg))
                    .catch(err => console.log('Error al registrar SW', err));
            });
        }
    </script>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unemi: {
                            blue: '#0F1E4B',
                            orange: '#EF7D00',
                            bg: '#F8FAFC',
                            text: '#1E293B'
                        },
                        unemi_hover: {
                            orange: '#d97200',
                            blue: '#0c183b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.474.0/dist/umd/lucide.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.15.10/dist/sweetalert2.all.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>

    <link rel="icon" type="image/svg+xml" href="/static/img/icono.svg">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-unemi-bg text-unemi-text min-h-screen flex flex-col">

    <!-- Global Loader -->
    <div id="global-loader" class="fixed inset-0 z-[100] flex items-center justify-center bg-transparent transition-opacity duration-300">
        <div class="flex flex-col items-center">
            <img src="/static/img/TIGRILLO_LOAD_3.gif" class="w-48 h-auto object-contain" alt="Cargando">
             <p class="mt-[-10px] text-unemi-blue font-bold text-lg animate-pulse">Cargando...</p>
        </div>
    </div>

    <!-- Header (Optional override) -->
    {% block header %}
    <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center space-x-3">
            <img src="/static/img/icono.svg" alt="UNEMI Logo" class="w-12 h-12 object-contain">
            <span class="font-bold tracking-widest text-unemi-blue text-lg">MARCHA UNEMI</span>
        </div>
        
        <div id="user-info" class="hidden flex items-center space-x-4">
            <div class="text-right hidden sm:block">
                <p id="nav-username" class="text-sm font-bold text-unemi-blue leading-none"></p>
                <p id="nav-group" class="text-xs text-slate-500 mt-1 uppercase tracking-tighter"></p>
            </div>
            <div class="w-10 h-10 bg-slate-100 rounded-full border border-slate-200 flex items-center justify-center font-bold text-unemi-blue">
                <i data-lucide="user"></i>
            </div>
        </div>
    </header>
    {% endblock %}

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto p-10 border-t border-slate-100 text-center flex flex-col items-center bg-white">
        <div class="mb-6">
            <h4 class="text-unemi-blue font-black text-xl uppercase tracking-tighter">MUC-FEUE</h4>
            <p class="text-slate-400 text-[10px] font-bold tracking-[0.4em] uppercase mt-1">Gran Marcha Universitaria 2026</p>
        </div>
        
        <div class="flex flex-col items-center space-y-1">
            <p class="text-slate-400 text-[9px] font-bold uppercase tracking-widest mb-1">Desarrollado por:</p>
            <div class="flex items-center space-x-4 text-slate-600 font-bold text-xs uppercase tracking-tight">
                <span class="hover:text-unemi-orange transition-colors cursor-default">Ing. Jaione Cherres</span>
                <span class="w-1.5 h-1.5 rounded-full bg-unemi-orange"></span>
                <span class="hover:text-unemi-blue transition-colors cursor-default">Ing. Ronny Arellano</span>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // Loader Login
        window.addEventListener('load', () => {
            const loader = document.getElementById('global-loader');
            if(loader) {
                loader.classList.add('opacity-0');
                setTimeout(() => {
                    loader.classList.add('hidden');
                }, 300);
            }
        });

        // Global functions to control loader
        window.showLoader = () => {
            const loader = document.getElementById('global-loader');
            if(loader) {
                loader.classList.remove('hidden');
                setTimeout(() => loader.classList.remove('opacity-0'), 10);
            }
        };

        window.hideLoader = () => {
            const loader = document.getElementById('global-loader');
            if(loader) {
                loader.classList.add('opacity-0');
                setTimeout(() => {
                    loader.classList.add('hidden');
                }, 300);
            }
        };

        // --- HELPER: Descarga Segura para PWA (Blob + Web Share) ---
        // globally available for students and leaders
        window.downloadFile = async function (url, filename) {
            // Feedback visual si existe el botón
            const btn = event ? event.currentTarget : null;
            let originalHTML = "";
            if (btn && btn.tagName === 'BUTTON') {
                originalHTML = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="animate-spin" data-lucide="loader-2"></i>';
                if(window.lucide) lucide.createIcons();
            }

            try {
                // Si estamos en dashboard.js 'token' existe, si no, es público
                const authToken = window.token || localStorage.getItem('token');
                const headers = {};
                if (authToken) headers['Authorization'] = `Token ${authToken}`;

                const response = await axios.get(url, {
                    headers: headers,
                    responseType: 'blob'
                });

                const contentType = response.headers['content-type'] || (filename.endsWith('.pdf') ? 'application/pdf' : 'image/png');
                const blob = new Blob([response.data], { type: contentType });

                // iOS / Android PWA: Use Web Share API if possible
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: contentType })] })) {
                    const file = new File([blob], filename, { type: contentType });
                    await navigator.share({
                        files: [file],
                        title: 'Descargar ' + filename,
                        text: 'Marcha UNEMI 2026'
                    });
                } else {
                    // PC / Standard fallback
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        window.URL.revokeObjectURL(downloadUrl);
                        document.body.removeChild(a);
                    }, 150);
                }

                if (window.Swal) {
                    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                    Toast.fire({ icon: 'success', title: 'Archivo procesado' });
                }

            } catch (e) {
                console.error("Error en descarga:", e);
                if (e.name !== 'AbortError' && e.name !== 'NotAllowedError') {
                    if (window.showErrorAlert) showErrorAlert("No se pudo procesar la descarga.");
                    else alert("Error al descargar el archivo.");
                }
            } finally {
                if (btn && btn.tagName === 'BUTTON') {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                    if(window.lucide) lucide.createIcons();
                }
            }
        };
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
